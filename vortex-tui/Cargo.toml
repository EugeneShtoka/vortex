[package]
name = "vortex-tui"
version = "0.1.0"
edition = "2021"
description = "Terminal observer for the Vortex automation orchestrator"
license = "MIT"

[[bin]]
name = "vortex-tui"
path = "src/main.rs"

[dependencies]
vortex-core = { path = "../vortex-core" }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
indexmap = "2"
crossterm = "0.28"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.12", features = ["json"] }

[dev-dependencies]
tempfile = "3"
